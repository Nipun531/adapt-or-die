<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0d0c0b;color:#e8dfcc;font:15px/1.45 "Atkinson Hyperlegible",sans-serif}
.c{font-family:Cinzel,serif}
header{height:60px;display:flex;align-items:center;padding:0 40px;background:#1a1714;border-bottom:2px solid #8a6d36}
header nav{margin-left:auto;display:flex;gap:24px;color:#b9ab8f}
.arena{height:560px;display:grid;place-items:center;background:radial-gradient(#2a2420,#0d0c0b 70%)}
.arena h2{font-size:48px;color:#d6b56c}
.arena p{color:#b9ab8f;text-align:center}
.actions{display:flex;gap:18px;justify-content:center;margin-top:24px}
.btn{border:2px solid #8a6d36;background:#1a1714;padding:14px 34px;font-size:20px}
.hud{position:absolute;left:40px;right:40px;bottom:40px;display:grid;grid-template-columns:1fr 1fr;gap:60px}
.hud .n{font-size:20px} .bar{height:14px;border:1px solid #8a6d36;margin-top:6px} .bar i{display:block;height:100%}
</style></head><body>
<header><span class="c" style="font-size:22px">The Boss Remembers</span><nav><span>Duel</span><span>Rules</span><span>Workshop</span></nav></header>
<div class="arena"><div><h2 class="c">The Boss strikes</h2><p>Mace · melee · heavy</p><div class="actions"><span class="btn c">Block 30%</span><span class="btn c">Dodge 10%</span></div></div></div>
<div class="hud"><div><span class="n c">You</span><div class="bar"><i style="width:63%;background:#3d6fb4"></i></div></div><div><span class="n c">The Boss</span><div class="bar"><i style="width:73%;background:#9b2a2a"></i></div></div></div>
</body></html>
